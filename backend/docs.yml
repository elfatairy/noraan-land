  /api/course/:id:
    get:
      tags:
        - Course
      summary: Get course
      description: Get course by its id
      parameters:
        - name: id
          in: query
          description: the course id
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "User is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "200":
          description: Success
          content:
            application/json:
              example:
                value:
                  message: "Courses retrieved successfully"
                  data:
                    course:
                      id: 1
                      name: name
                      description: description
                      createdAt: 2024-12-11T13:46:10.000Z
                      updatedAt: 2024-12-11T13:46:10.000Z
  /api/course/:
    post:
      tags:
        - Course
      summary: Create course
      description: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                groupPrice:
                  type: string
                individualPrice:
                  type: string
              required:
                - name
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "User is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the user doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                COURSE_DOESNT_EXIST:
                  value:
                    name: "COURSE_DOESNT_EXIST"
                    message: "No course with this id"
        "200":
          description: Success
          content:
            application/json:
              example:
                value:
                  message: "Course created successfully"
                  data:
                    course:
                      id: 1
                      name: name
                      description: description
                      createdAt: 2024-12-11T13:46:10.000Z
                      updatedAt: 2024-12-11T13:46:10.000Z
    get:
      tags:
        - Course
      summary: Get all courses
      description: Get all courses
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "User is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "200":
          description: Success
          content:
            application/json:
              example:
                value:
                  message: "Courses retrieved successfully"
                  data:
                    courses:
                      - id: 1
                        name: name
                        description: description
                        createdAt: 2024-12-11T13:46:10.000Z
                        updatedAt: 2024-12-11T13:46:10.000Z

  /api/session/group:
    post:
      tags:
        - Session
      summary: Create group session
      description: Scedule a new group session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: integer
                quizzesLink:
                  type: string
                date:
                  type: string
                duration:
                  type: integer
                title:
                  type: string
                description:
                  type: string
              required:
                - name
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "User is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the user doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
                QUIZES_NOT_VALID:
                  value:
                    name: "QUIZES_NOT_VALID"
                    message: "The quizes link isn't a valid link"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                COURSE_DOESNT_EXIST:
                  value:
                    name: "COURSE_DOESNT_EXIST"
                    message: "No course with this id"
                DATE_NOT_AVAILABLE:
                  value:
                    name: "DATE_NOT_AVAILABLE"
                    message: "This date is not available, please choose another date/duration"
        "200":
          description: Success
          content:
            application/json:
              example:
                value:
                  message: "Session created successfully"
                  data:
                    session:
                      id: 1
                      courseId: 1
                      status: UPCOMING
                      title: string
                      description: description
                      quizzesLink: "quizes.com"
                      bunnyLink: null
                      zoomLink: null
                      createdAt: 2024-12-11T13:46:10.000Z
                      updatedAt: 2024-12-11T13:46:10.000Z
                      calendarDateId: 1
