                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the user doesn't have"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Subscription Completed Successfully"
                data:
                  {
                    "user":
                      {
                        "id": 2,
                        "name": "Omar Hassan2",
                        "email": "omar2@gmail.com",
                        "age": 20,
                        "location": "cairo helmyat",
                        "gender": "MALE",
