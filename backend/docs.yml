openapi: "3.0.3"
info:
  title: Noraan API Documentation
  description: API endpoints for the Noraan Website
  version: "1.0"
servers:
  - url: http://localhost:3000
paths:
  /api/students/auth/login:
    post:
      tags:
        - Authentication
      summary: Login Student
      description: Login a student with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: omar@gmail.com
                password:
                  type: string
                  example: asdASD123
              required:
                - email
                - password
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "404":
          description: Not Found
          content:
            application/json:
              examples:
                EMAIL_PASSWORD_INCORRECT:
                  value:
                    name: "EMAIL_PASSWORD_INCORRECT"
                    message: "Either the email or password is incorrect"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Student Logged In Successfully"
                data:
                  token: "JWT_TOKEN"
                  student:
                    {
                      "id": 1,
                      "name": "Omar Hassan",
                      "email": "omar@gmail.com",
                      "phone": "+201021853989",
                      "age": 23,
                      "location": "cairo",
                      "gender": "MALE"
                    }
  /api/students/auth/google-login:
    post:
      tags:
        - Authentication
      summary: Google Sign in Student
      description: Authenticate a student with Google signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  example: 4235235
                phone:
                  type: string
                  example: +01021853989
              required:
                - idToken
                - phone
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
                ERROR_VERIFING_GOOGLE:
                  value:
                    name: "ERROR_VERIFING_GOOGLE"
                    message: "Some error message"
                GOOGLE_ACCOUNT_EMPTY:
                  value:
                    name: "GOOGLE_ACCOUNT_EMPTY"
                    message: "This google account profile's name or email is empty"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Student Logged In Successfully"
                data:
                  token: "JWT_TOKEN"
                  student:
                    id: 1
                    email: email@gmail.com
                    name: name
                    phone: +201021853989
                    age: 23,
                    location: "cairo"
                    gender: "MALE"
  /api/students/auth/register:
    post:
      tags:
        - Authentication
      summary: Register Student
      description: Register a student with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: omar
                email:
                  type: string
                  example: omar@gmail.com
                phone:
                  type: string
                  example: +201021853989
                password:
                  type: string
                  example: asdASD123
                age:
                  type: number
                  example: 19
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                  example: MALE
                location:
                  type: string
                  example: cairo
              required:
                - name
                - email
                - phone
                - password
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                NAME_ALREADY_EXISTS:
                  value:
                    name: "NAME_ALREADY_EXISTS"
                    message: "Name already exists"
                EMAIL_ALREADY_EXISTS:
                  value:
                    name: "EMAIL_ALREADY_EXISTS"
                    message: "Email already exists"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Student Registered Successfully"
                data:
                  token: "JWT_TOKEN"
                  student:
                    {
                      "id": 1,
                      "name": "Omar Hassan",
                      "email": "omar@gmail.com",
                      "phone": "+201021853989",
                      "age": 23,
                      "location": "cairo",
                      "gender": "MALE"
                    }
  /api/students/auth/update-profile:
    patch:
      tags:
        - Authentication
      summary: Update Profile
      description: Update student's profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Name
                phone:
                  type: string
                  example: +01021853988
                age:
                  type: number
                  example: 19
                location:
                  type: string
                  example: Mansura
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                  example: MALE
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "Student is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the student doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                NAME_ALREADY_EXISTS:
                  value:
                    name: "NAME_ALREADY_EXISTS"
                    message: "Name already exists"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Profile Updated Successfully"
                data:
                  "student": {
                    "id": 1,
                    "name": "Updated Name",
                    "email": "omar@gmail.com",
                    "phone": "+01021853988",
                    "age": 19,
                    "location": "cairo helmyat",
                    "gender": "MALE"
                  }
  /api/students/auth/getMe:
    get:
