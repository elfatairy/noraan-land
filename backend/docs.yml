openapi: "3.0.3"
info:
  title: Noraan API Documentation
  description: API endpoints for the Noraan Website
  version: "1.0"
servers:
  - url: http://localhost:3000
paths:
  /api/users/auth/login:
    post:
      tags:
        - Authentication
      summary: Login User
      description: Login a user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "404":
          description: Not Found
          content:
            application/json:
              examples:
                EMAIL_PASSWORD_INCORRECT:
                  value:
                    name: "EMAIL_PASSWORD_INCORRECT"
                    message: "Either the email or password is incorrect"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "User Logged In Successfully"
                data:
                  token: "JWT_TOKEN"
                  user:
                    id: 1
                    email: email@gmail.com
                    name: name
  /api/users/auth/google-login:
    post:
      tags:
        - Authentication
      summary: Google Sign in User
      description: Authenticate a user with Google signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                ERROR_VERIFING_GOOGLE:
                  value:
                    name: "ERROR_VERIFING_GOOGLE"
                    message: "Some error message"
                GOOGLE_ACCOUNT_EMPTY:
                  value:
                    name: "GOOGLE_ACCOUNT_EMPTY"
                    message: "This google account profile's name or email is empty"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "User Logged In Successfully"
                data:
                  token: "JWT_TOKEN"
                  user:
                    id: 1
                    email: email@gmail.com
                    name: name
                    age: 23,
                    location: "cairo"
                    gender: "MALE"
  /api/users/auth/register:
    post:
      tags:
        - Authentication
      summary: Register User
      description: Register a user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                NAME_ALREADY_EXISTS:
                  value:
                    name: "NAME_ALREADY_EXISTS"
                    message: "Name already exists"
                EMAIL_ALREADY_EXISTS:
                  value:
                    name: "EMAIL_ALREADY_EXISTS"
                    message: "Email already exists"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "User Registered Successfully"
                data:
                  token: "JWT_TOKEN"
                  user:
                    id: 1
                    email: email@gmail.com
                    name: name
                    age: 23,
                    location: "cairo"
                    gender: "MALE"
  /api/users/auth/update-profile:
    patch:
      tags:
        - Authentication
      summary: Update Profile
      description: Update user's profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                age:
                  type: number
                location:
                  type: string
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "User is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the user doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                NAME_ALREADY_EXISTS:
                  value:
                    name: "NAME_ALREADY_EXISTS"
                    message: "Name already exists"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Profile Updated Successfully"
                data:
                  "user":
                    {
                      "id": 2,
                      "name": "Omar Hassan2",
                      "email": "omar2@gmail.com",
                      "age": 20,
                      "location": "cairo helmyat",
                      "gender": "MALE",
                    }

  /api/users/actions/applyForCourse:
    post:
      tags:
        - User Actions
      summary: Apply for a course
      description: User apply for a course so the admin can view him and create trial session for him
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: number
                availableTime:
                  type: string
                userNotes:
                  type: string
                sessionType:
                  type: string
                  enum:
                    - GROUP
                    - INDIVIDUAL
              required:
                - courseId
                - availableTime
                - sessionType
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "User is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the user doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                COURSE_DOESNT_EXIST:
                  value:
                    name: "COURSE_DOESNT_EXIST"
                    message: "No course with this id"
                USER_COURSE_ALERADY_EXIST:
                  value:
                    name: "USER_COURSE_ALERADY_EXIST"
                    message: "This user has already applied for this course"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "User applied for course successfully"
                data:
                  "user":
                    {
                      "id": 2,
                      "name": "Omar Hassan2",
                      "email": "omar2@gmail.com",
                      "age": 20,
                      "location": "cairo helmyat",
                      "gender": "MALE",
                    }
                  "course":
                    {
                      "id": 1,
                      "name": "Test Course",
                      "groupPrice": 100,
                      "individualPrice": 500,
                      "description": null,
                      "createdAt": "2024-12-12T16:31:46.000Z",
                      "updatedAt": "2024-12-12T16:31:46.000Z",
                    }
                  "availableTime": "From sundays to thursdays 3pm-8pm"
                  "userNotes": "Some notes"

  /api/users/actions/getMe:
    get:
      tags:
        - Authentication
      summary: Get User's Profile
      description: Get the profile of the user (his details)
      responses:
        "400":
