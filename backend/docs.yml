  /api/students/actions/intentPaypal/:courseId:
    post:
      tags:
        - Subscription
      summary: Make Paypal Intention
      description: Make intention for paypal payment and returen the plan id to be used in the payment
      parameters:
        - name: courseId
          in: path
          description: the course id
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "Student is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the student doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                COURSE_DOESNT_EXIST:
                  value:
                    name: "COURSE_DOESNT_EXIST"
                    message: "No course with this id"
                USER_COURSE_DOESNT_EXIST:
                  value:
                    name: "USER_COURSE_DOESNT_EXIST"
                    message: "This student has not applied for this course"
                ALREADY_SUBSCRIBED:
                  value:
                    name: "ALREADY_SUBSCRIBED"
                    message: "Student already subscribed to this course"
                HOURS_NOT_SPECIFIED:
                  value:
                    name: "HOURS_NOT_SPECIFIED"
                    message: "The admin should specify the hours for the student first"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Paypal Subscription Intention Made Successfully"
                data:
                  {
