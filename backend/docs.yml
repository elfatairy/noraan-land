                    message: "This request needs permessions the student doesn't have"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Profile Retruned Successfully"
                data:
                  {
                    "student": {
                      "id": 2,
                      "name": "Omar Hassan2",
                      "email": "omar2@gmail.com",
                      "phone": "+201021853989",
                      "age": 20,
                      "location": "cairo helmyat",
                      "gender": "MALE",
                    },
                  }
  
  /api/students/actions/applyForCourse:
    post:
      tags:
        - Student Actions
      summary: Apply for a course
      description: Student apply for a course so the admin can view him and create trial session for him
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: number
                  example: number
                availableTime:
                  type: string
                  example: From sundays to thursdays 3pm-8pm
                studentNotes:
                  type: string
                  example: I sleep early, can I have the sessions in the morning
                sessionType:
                  type: string
                  enum:
                    - GROUP
                    - PRIVATE
                  example: PRIVATE
              required:
                - courseId
                - availableTime
                - sessionType
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                UNAUTHENTICATED:
                  value:
                    name: "UNAUTHENTICATED"
                    message: "Student is unauthenticated and this request requires authentication payload data"
                TOKEN_EXPIRED:
                  value:
                    name: "TOKEN_EXPIRED"
                    message: "The token you are using expird, please log in again to retrieve another token."
                UNAUTHORIZED:
                  value:
                    name: "UNAUTHORIZED"
                    message: "This request needs permessions the student doesn't have"
                INVALID_PAYLOAD:
                  value:
                    name: "INVALID_PAYLOAD"
                    message: "Invalid payload data"
        "409":
          description: Conflict
          content:
            application/json:
              examples:
                COURSE_DOESNT_EXIST:
                  value:
                    name: "COURSE_DOESNT_EXIST"
                    message: "No course with this id"
                USER_COURSE_ALERADY_EXIST:
                  value:
                    name: "USER_COURSE_ALERADY_EXIST"
                    message: "This student has already applied for this course"
        "200":
          description: Success
          content:
            application/json:
              example:
                message: "Student applied for course successfully"
                data:
                  {
                    "student": {
                      "id": 1,
                      "name": "Omar Hassan",
                      "email": "omar@gmail.com",
                      "phone": "+01021853989",
                      "age": 19,
                      "location": "cairo",
                      "gender": "MALE"
                    },
                    "course": {
                        "id": 1,
                        "name": "Updated Course Name",
                        "privatePrice": 6,
                        "groupPrice": 3.5,
                        "description": "Updated Description",
                        "paypalProductId": "gegfg4tfg4w",
                        "zoomLink": "https://zoom.us/j/123456789",
                        "createdAt": "2025-03-08T06:50:08.965Z",
                        "updatedAt": "2025-03-08T07:05:58.172Z"
                    },
                    "availableTime": "From sundays to thursdays 3pm-8pm",
                    "studentNotes": "I sleep early, can I have the sessions in the morning",
                    "preferredSessionType": "PRIVATE"
                  }

